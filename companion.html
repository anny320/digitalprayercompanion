/* ── Storage (namespaced under the shared dpc_v1 store) ── */
const doneKey  = (plan, n)      => `companion_${plan}_done_${n}`;
const signKey  = (plan, n)      => `companion_${plan}_sign_${n}`;
const commKey  = (plan, n, i)   => `companion_${plan}_commit_${n}_${i}`;
const jrnlKey  = (plan, n)      => `companion_${plan}_journal_${n}`;

function doneCount(plan) {
  const d = loadData(); const p = PLANS[plan]; let c = 0;
  for (let i = 1; i <= p.length; i++) if (d[doneKey(plan, i)]) c++;
  return c;
}

/* ── WhatsApp share ─────────────────────────────────────── */
function shareWhatsApp(text) {
  const url = window.location.href.split('#')[0];
  const msg = encodeURIComponent(`${text}\n${url}`);
  window.open(`https://wa.me/?text=${msg}`, '_blank', 'noopener');
  trackEvent('companion_share', { channel: 'whatsapp' });
}
window.shareWhatsApp = shareWhatsApp;

/* ════════════ VIEW: plan picker ════════════ */
function renderPicker() {
  document.title = "The Companion — Scripture for the Season You're In";
  const live = Object.values(PLANS).map(p => {
    const done = doneCount(p.id);
    const cta  = done > 0 ? `Continue · ${done}/${p.length} done` : (p.length === 1 ? 'Begin →' : 'Start the plan →');
    return `
      <a class="c-plan-card" href="companion.html?plan=${p.id}">
        <div class="c-plan-card__len">${p.length}<small>${p.length === 1 ? 'Day' : 'Days'}</small></div>
        <div class="c-plan-card__seed">${p.seed}</div>
        <div class="c-plan-card__title">${p.emoji} ${p.title}</div>
        <div class="c-plan-card__desc">${p.blurb}</div>
        <div class="c-plan-card__cta">${cta}</div>
      </a>`;
  }).join('');

  const soon = SOON.map(s => `
    <div class="c-plan-card soon">
      <div class="c-plan-card__len">${s.len}<small>Days</small></div>
      <div class="c-plan-card__seed">${s.seed}</div>
      <div class="c-plan-card__title">${s.title}</div>
      <div class="c-plan-card__desc">Full plan in progress.</div>
    </div>`).join('');

  return `
    <div class="day-hero">
      <div class="container day-hero__content">
        <span class="day-num-badge">The Companion</span>
        <h1>📖 Scripture for the Season You're In</h1>
        <p class="scripture-ref">Honest retellings · one real question · space to journal</p>
      </div>
    </div>
    <div class="c-planwrap">
      <div class="section-header fade-up" style="text-align:center;max-width:640px;margin:0 auto 2.5rem">
        <p style="color:var(--text-muted);line-height:1.8">Not a reading plan to get through — a companion for where you actually are. Each day gives you a story told like a human story, what was really going on beneath it, one honest question, a verse in plain language, and a private space to write. Pick a length that fits your season.</p>
      </div>
      <div class="c-plan-grid fade-up">${live}${soon}</div>
      <p class="journal-hint" style="text-align:center;margin-top:2rem">🔒 Everything you write stays on your device. No account, no sign-up, nothing shared.</p>
    </div>`;
}

/* ════════════ VIEW: plan overview ════════════ */
function renderOverview(plan) {
  const p = PLANS[plan];
  document.title = `${p.title} — The Companion`;
  const d = loadData();
  const done = doneCount(plan);
  const pct  = Math.round((done / p.length) * 100);

  let nextDay = 1;
  for (let i = 1; i <= p.length; i++) if (d[doneKey(plan, i)]) nextDay = Math.min(p.length, i + 1);

  const cards = Object.keys(p.days).map(n => {
    const day = p.days[n];
    const isDone = d[doneKey(plan, n)];
    return `
      <a class="c-day-card${isDone ? ' done' : ''}" href="companion.html?plan=${plan}&day=${n}">
        <div class="c-day-card__num">${isDone ? '✓' : n}</div>
        <div>
          <div class="c-day-card__title">${day.emoji} ${day.title}</div>
          <div class="c-day-card__sub">Day ${n} · ${day.ref}</div>
        </div>
      </a>`;
  }).join('');

  const startLabel = done === 0 ? 'Begin Day 1' : (done >= p.length ? 'Revisit the plan' : `Continue · Day ${nextDay}`);

  return `
    <div class="day-hero">
      <div class="container day-hero__content">
        <span class="day-num-badge">${p.length}-Day Plan</span>
        <h1>${p.emoji} ${p.title}</h1>
        <p class="scripture-ref">${p.seed}</p>
      </div>
    </div>
    <div class="day-content">
      <p style="font-family:var(--serif);font-size:1.12rem;color:var(--purple);font-style:italic;line-height:1.7">${p.blurb}</p>

      <div class="c-progress-wrap">
        <div class="c-progress-label"><span>Your progress</span><span>${done} / ${p.length}</span></div>
        <div class="c-progress-bar"><div class="c-progress-fill" style="width:${pct}%"></div></div>
      </div>

      <a href="companion.html?plan=${plan}&day=${done >= p.length ? 1 : nextDay}" class="c-complete-btn" style="text-decoration:none;text-align:center">${startLabel}</a>

      <div class="c-section">
        <h3>The Days</h3>
        <div class="c-day-grid">${cards}</div>
      </div>

      <div class="c-day-nav">
        <a href="companion.html" class="btn btn--outline" style="color:var(--purple);border-color:var(--purple)">← All plans</a>
        <span></span>
      </div>
    </div>`;
}

/* ════════════ VIEW: a single day ════════════ */
function renderDayView(plan, n) {
  const p = PLANS[plan];
  const day = p.days[n];
  if (!day) { return renderOverview(plan); }
  document.title = `Day ${n}: ${day.title} — ${p.title}`;
  const d = loadData();

  const prev = n > 1
    ? `<a href="companion.html?plan=${plan}&day=${n-1}" class="btn btn--outline" style="color:var(--purple);border-color:var(--purple)">← Day ${n-1}</a>`
    : `<a href="companion.html?plan=${plan}" class="btn btn--outline" style="color:var(--purple);border-color:var(--purple)">← Overview</a>`;
  const next = n < p.length
    ? `<a href="companion.html?plan=${plan}&day=${n+1}" class="btn btn--primary">Day ${n+1} →</a>`
    : `<a href="companion.html?plan=${plan}" class="btn btn--primary">Finish →</a>`;

  const verses = day.verses.map(v => `"${v.text}"<cite>— ${v.ref}</cite>`).join('<br><br>');
  const situations = SITUATIONS.map(([k, label]) => `
    <div class="c-situ-item">
      <div class="c-situ-item__label">${label}</div>
      <p>${day.situations[k]}</p>
    </div>`).join('');

  const sign = d[signKey(plan, n)] || {};
  const commits = day.commitments.map((c, i) => {
    const on = d[commKey(plan, n, i)];
    return `
      <li class="c-commit-item${on ? ' checked' : ''}" data-ci="${i}">
        <input type="checkbox" ${on ? 'checked' : ''} />
        <span>${c}</span>
      </li>`;
  }).join('');

  const isDone = d[doneKey(plan, n)];

  return `
    <div class="day-hero">
      <div class="container day-hero__content">
        <span class="day-num-badge">Day ${n} of ${p.length}</span>
        <h1>${day.emoji} ${day.title}</h1>
        <p class="scripture-ref">${day.ref} · ${p.title}</p>
      </div>
    </div>

    <div class="day-content">

      <div class="c-section">
        <div class="c-section__eyebrow">The Story</div>
        <h3>${day.title}</h3>
        <p>${day.story}</p>
      </div>

      <div class="c-section">
        <div class="c-section__eyebrow">The Lesson</div>
        <h3>What was really happening</h3>
        <p>${day.lesson}</p>
      </div>

      <div class="c-section">
        <div class="c-section__eyebrow">The Application</div>
        <h3>One honest question</h3>
        <div class="c-application"><p>${day.application}</p></div>
      </div>

      <div class="c-section">
        <div class="c-section__eyebrow">The Verse</div>
        <h3>Hold onto this</h3>
        <div class="scripture-block">${verses}</div>
        <div class="c-plain"><strong>In plain words:</strong> ${day.plain}</div>
      </div>

      <div class="c-section">
        <div class="c-section__eyebrow">Where You Are</div>
        <h3>Wherever you are right now</h3>
        <div class="c-situ-list">${situations}</div>
      </div>

      <div class="c-section">
        <div class="c-section__eyebrow">Journal</div>
        <h3>📝 Your private space</h3>
        <p style="font-size:.9rem;color:var(--text-muted);margin-bottom:.5rem">${day.prompt}</p>
        <textarea class="journal-area" data-key="${jrnlKey(plan, n)}" placeholder="Write freely — no one sees this but you…"></textarea>
        <p class="journal-hint">🔒 Saved locally on your device only</p>

        <h4 style="margin:1.75rem 0 .5rem;color:var(--purple)">This week's micro-commitments</h4>
        <ul class="c-commit-list">${commits}</ul>

        <div class="c-sign-row">
          <div class="c-sign-field">
            <label for="c-sign-name">Signed</label>
            <input id="c-sign-name" class="c-sign-name" type="text" placeholder="Your name" value="${(sign.name || '').replace(/"/g, '&quot;')}" />
          </div>
          <div class="c-sign-field">
            <label for="c-sign-date">Date</label>
            <input id="c-sign-date" type="date" value="${sign.date || ''}" />
          </div>
        </div>
      </div>

      <button class="c-complete-btn${isDone ? ' done' : ''}" data-plan="${plan}" data-day="${n}">${isDone ? '✔ Day Completed' : `Mark Day ${n} Complete`}</button>

      <div id="c-summary-slot"></div>

      <div class="c-day-nav">
        ${prev}
        <button class="btn btn--whatsapp" onclick="shareWhatsApp('Day ${n}: ${day.title.replace(/'/g, "\\'")} — The Companion (${p.title})')">Share on WhatsApp</button>
        ${next}
      </div>
    </div>`;
}

/* ── Summary card (plan complete) ── */
function summaryCard(plan) {
  const p = PLANS[plan];
  return `
    <div class="c-summary fade-up visible">
      <div class="ornament" style="color:var(--gold-light)">✦ ✦ ✦</div>
      <h2>You finished ${p.title}</h2>
      <div class="c-summary__stat">${p.length}/${p.length}</div>
      <p>${p.length === 1 ? 'One day, one honest step.' : `${p.length} days of showing up for yourself.`} Whatever you wrote is still here, and still yours.</p>
      <button class="btn btn--whatsapp" onclick="shareWhatsApp('I just finished the ${p.length}-day &quot;${p.title}&quot; plan on The Companion.')">Share your milestone</button>
    </div>`;
}

/* ── Bind day-view interactions after render ── */
function bindDayView(plan, n) {
  // micro-commitments
  document.querySelectorAll('.c-commit-item').forEach(li => {
    const i = li.dataset.ci;
    const box = li.querySelector('input');
    li.addEventListener('click', (e) => {
      if (e.target !== box) box.checked = !box.checked;
      const data = loadData(); data[commKey(plan, n, i)] = box.checked; saveData(data);
      li.classList.toggle('checked', box.checked);
    });
  });

  // signed name + date (auto-save)
  const nameEl = document.getElementById('c-sign-name');
  const dateEl = document.getElementById('c-sign-date');
  function saveSign() {
    const data = loadData();
    data[signKey(plan, n)] = { name: nameEl.value.trim(), date: dateEl.value };
    saveData(data);
  }
  if (nameEl) nameEl.addEventListener('input', saveSign);
  if (dateEl) dateEl.addEventListener('change', saveSign);

  // completion
  const btn = document.querySelector('.c-complete-btn[data-day]');
  if (btn) {
    btn.addEventListener('click', () => {
      // stamp the signature date if left blank, then persist name + date
      if (dateEl && !dateEl.value) dateEl.valueAsDate = new Date();
      saveSign();
      const data = loadData(); // reload so the just-saved signature isn't clobbered
      data[doneKey(plan, n)] = true;
      saveData(data);
      btn.textContent = '✔ Day Completed';
      btn.classList.add('done');
      showToast(`Day ${n} complete. Keep going 🌿`, 'success');
      trackEvent('companion_day_completed', { plan, day: n });
      if (doneCount(plan) >= PLANS[plan].length) {
        document.getElementById('c-summary-slot').innerHTML = summaryCard(plan);
        document.getElementById('c-summary-slot').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  }

  // if the plan was already finished, show the summary on load
  if (doneCount(plan) >= PLANS[plan].length) {
    const slot = document.getElementById('c-summary-slot');
    if (slot) slot.innerHTML = summaryCard(plan);
  }
}

/* ── Router ── */
(function () {
  const params = new URLSearchParams(window.location.search);
  const plan = params.get('plan');
  const app  = document.getElementById('companion-app');

  if (!plan || !PLANS[plan]) {
    app.innerHTML = renderPicker();
    trackEvent('companion_view', { view: 'picker' });
    return;
  }

  const dayParam = params.get('day');
  if (dayParam == null) {
    app.innerHTML = renderOverview(plan);
    trackEvent('companion_view', { view: 'overview', plan });
    return;
  }

  const n = Math.min(PLANS[plan].length, Math.max(1, parseInt(dayParam) || 1));
  app.innerHTML = renderDayView(plan, n);
  bindDayView(plan, n);
  trackEvent('companion_view', { view: 'day', plan, day: n });
})();
</script>
</body>
</html>
